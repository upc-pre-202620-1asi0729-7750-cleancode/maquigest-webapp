<div class="profile-page">

  <h1>
    {{ 'profile.title' | translate }}
  </h1>

  @if (loading()) {
    <mat-spinner diameter="40"></mat-spinner>
  }

  @if (error()) {
    <mat-error>{{ error() }}</mat-error>
  }

  @if (!loading() && !error()) {

    @if (profile(); as currentProfile) {

      @if (isEditing()) {

        <app-edit-profile
          [profile]="currentProfile"
          (profileUpdated)="updateProfile($event)"
        />

        <button
          mat-button
          type="button"
          (click)="cancelEditing()">
          {{ 'profile.cancel' | translate }}
        </button>

      } @else {

        <app-company-profile
          [profile]="currentProfile"
        />

        <button
          mat-raised-button
          color="primary"
          type="button"
          (click)="startEditing()">
          {{ 'profile.edit' | translate }}
        </button>

      }

    } @else {

      <p>
        {{ 'profile.not-found' | translate }}
      </p>

    }

  }

</div>
